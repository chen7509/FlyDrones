schema_version: 2
seed: 42
algorithm:
  name: recurrent_ppo_ctde
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.20
  entropy_coefficient: 0.01
  value_coefficient: 0.50
  update_epochs: 4
frozen:
  - malecns_reflex
  - safety_projector
  - px4_inner_loop
deployment:
  maximum_policy_latency_ms: 35
  central_control_commands_allowed: 0
  maximum_skill_drop: 0.02
  shadow_only_default: true
acceptance:
  minimums:
    episodes: 1000
    full_scale_episodes: 100
    exit_success: 0.95
    tracking_success: 0.95
    search_coverage: 0.95
    gate_success: 0.90
    compound_success: 0.90
  maximums:
    tracking_rmse_m: 0.75
    tracking_loss_fraction: 0.05
    duplicate_coverage: 0.20
    formation_rmse_m: 0.40
    task_release_s: 3.0
    task_reopen_s: 3.2
    task_reassign_s: 5.0
    maximum_skill_drop: 0.02
  zeros:
    - collisions
    - geofence_violations
    - return_reserve_violations
    - central_control_commands
    - gate_contacts
profiles:
  smoke:
    - id: smoke-regression
      index: 0
      level: 0
      active_skills: [navigate_exit]
      fleets: [1]
      train_seeds: [1, 2]
      eval_seeds: [101]
      regression_seeds: [201]
      steps_per_batch: 8
      maximum_batches: 3
      patience: 2
      thresholds: {exit_success: 0.95}
    - id: smoke-tracking
      index: 1
      level: 1
      active_skills: [track_target]
      fleets: [1, 5]
      train_seeds: [3, 4]
      eval_seeds: [102]
      regression_seeds: [202]
      steps_per_batch: 8
      maximum_batches: 3
      patience: 2
      thresholds: {tracking_success: 0.95, tracking_rmse_m: 0.75}
  desktop:
    - id: desktop-regression
      index: 0
      level: 0
      active_skills: [navigate_exit]
      fleets: [1]
      train_seeds: [1001, 1002]
      eval_seeds: [1101, 1102]
      regression_seeds: [1201]
      steps_per_batch: 256
      maximum_batches: 20
      patience: 5
      thresholds: {exit_success: 0.95}
    - id: desktop-exit
      index: 1
      level: 1
      active_skills: [navigate_exit]
      fleets: [1, 5]
      train_seeds: [1003, 1004]
      eval_seeds: [1103, 1104]
      regression_seeds: [1202]
      steps_per_batch: 512
      maximum_batches: 30
